name: Validate static site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate game assets
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check JavaScript syntax
        run: |
          node --check game-core.js
          node --check game.js

      - name: Run gameplay tests
        run: node --test

      - name: Check required static assets
        run: |
          for asset in index.html style.css game-core.js game.js; do
            test -s "$asset"
          done

      - name: Check HTML references and game controls
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const html = fs.readFileSync('index.html', 'utf8');
          const requiredIds = [
            'gameCanvas',
            'scoreDisplay',
            'highScoreDisplay',
            'statusDisplay',
            'startButton',
            'pauseButton',
            'restartButton',
            'wallsButton',
            'muteButton'
          ];
          const directions = ['up', 'down', 'left', 'right'];
          const missingIds = requiredIds.filter((id) => !html.includes(`id="${id}"`));
          const missingReferences = ['style.css', 'game-core.js', 'game.js']
            .filter((asset) => !html.includes(`"${asset}"`));
          const missingDirections = directions.filter(
            (direction) => !html.includes(`data-direction="${direction}"`)
          );

          if (missingIds.length || missingReferences.length || missingDirections.length) {
            console.error({ missingIds, missingReferences, missingDirections });
            process.exit(1);
          }
          NODE

      - name: Check changed files for whitespace errors
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check --cached
          fi
