<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#39473a">
  <title>Nokia Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone" aria-label="Nokia Snake game">
    <header class="brand">NOKIA</header>
    <section class="lcd-bezel" aria-label="Game display">
      <div class="score-row" aria-live="polite">
        <span id="scoreDisplay">SCORE 000</span>
        <span id="highScoreDisplay">HI 000</span>
      </div>
      <canvas id="gameCanvas" aria-label="Snake game board"></canvas>
      <p id="statusDisplay" class="status">PRESS START</p>
    </section>
    <div class="softkeys" aria-label="Game actions">
      <button id="startButton" type="button">START</button>
      <button id="pauseButton" type="button" disabled>PAUSE</button>
      <button id="restartButton" type="button">RESTART</button>
    </div>
    <div class="d-pad" aria-label="Direction controls">
      <button type="button" class="up" data-direction="up" aria-label="Move up">▲</button>
      <button type="button" class="left" data-direction="left" aria-label="Move left">◀</button>
      <span class="center" aria-hidden="true"></span>
      <button type="button" class="right" data-direction="right" aria-label="Move right">▶</button>
      <button type="button" class="down" data-direction="down" aria-label="Move down">▼</button>
    </div>
    <div class="options">
      <button id="wallsButton" type="button">WALLS: OFF</button>
      <button id="muteButton" type="button">SOUND: OFF</button>
    </div>
    <p class="help">ARROWS / WASD · SPACE TO PAUSE</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
